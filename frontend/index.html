<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cnote — Write freely. Think clearly.</title>
    <meta name="description" content="A personal journal for the code you write, the verses that move you, and the thoughts you want to keep." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cnote.vercel.app" />
    <meta property="og:title" content="Cnote — Write freely. Think clearly." />
    <meta property="og:description" content="A personal journal for the code you write, the verses that move you, and the thoughts you want to keep." />
    <meta property="og:image" content="https://cnote.vercel.app/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://cnote.vercel.app" />
    <meta name="twitter:title" content="Cnote — Write freely. Think clearly." />
    <meta name="twitter:description" content="A personal journal for the code you write, the verses that move you, and the thoughts you want to keep." />
    <meta name="twitter:image" content="https://cnote.vercel.app/og-image.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap"
      rel="stylesheet"
    />

    <!-- Prevent theme flash -->
    <script>
      (function() {
        var theme = localStorage.getItem('cnote-theme');
        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
