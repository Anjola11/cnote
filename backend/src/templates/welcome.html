<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to cnote</title>
    <!--[if mso]>
    <noscript>
    <xml>
    <o:OfficeDocumentSettings>
    <o:PixelsPerInch>96</o:PixelsPerInch>
    </o:OfficeDocumentSettings>
    </xml>
    </noscript>
    <![endif]-->
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #fafaf8; color: #111110; margin: 0; padding: 0;">
    <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="background-color: #fafaf8;">
        <tr>
            <td align="center" style="padding: 40px 16px;">
                <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="max-width: 520px; background-color: #ffffff; border: 1px solid #e5e4de; border-radius: 20px;">
                    <tr>
                        <td style="padding: 40px 32px;">
                            <!-- Logo -->
                            <table role="presentation" cellpadding="0" cellspacing="0" width="100%">
                                <tr>
                                    <td align="center" style="padding-bottom: 32px;">
                                        <!--[if !mso]><!-->
                                        <img src="cid:logo.png" width="140" height="auto" alt="cnote" style="display: block; margin: 0 auto;">
                                        <!--<![endif]-->
                                    </td>
                                </tr>
                            </table>

                            <!-- Heading -->
                            <h1 style="font-size: 26px; color: #111110; margin: 0 0 16px 0; text-align: center; font-weight: 600;">Welcome to cnote!</h1>
                            <p style="color: #6b6a65; font-size: 15px; line-height: 1.6; margin: 0 0 28px 0; text-align: center;">Your email has been successfully verified. You're all set to start organizing your thoughts, code, and growth.</p>

                            <!-- CTA Button -->
                            <table role="presentation" cellpadding="0" cellspacing="0" width="100%">
                                <tr>
                                    <td align="center" style="padding: 8px 0 16px 0;">
                                        <!--[if mso]>
                                        <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" href="https://www.usecnote.xyz/feed" style="height:48px;width:200px;v-text-anchor:middle;" arcsize="25%" fillcolor="#6B5CE7" stroke="f">
                                        <center style="color:#ffffff;font-size:15px;font-weight:600;">Go to Dashboard</center>
                                        </v:roundrect>
                                        <![endif]-->
                                        <!--[if !mso]><!-->
                                        <a href="https://www.usecnote.xyz/feed" style="display: inline-block; background-color: #6B5CE7; color: #ffffff; text-decoration: none; padding: 14px 32px; border-radius: 12px; font-size: 15px; font-weight: 600; line-height: 1;">Go to Dashboard</a>
                                        <!--<![endif]-->
                                    </td>
                                </tr>
                            </table>

                            <!-- Footer -->
                            <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="margin-top: 36px; border-top: 1px solid #e5e4de;">
                                <tr>
                                    <td style="padding-top: 20px; text-align: center;">
                                        <p style="margin: 0 0 4px 0; font-size: 11px; color: #a8a79f;">If you have any questions, our support team is always here to help.</p>
                                        <p style="margin: 0; font-size: 11px; color: #a8a79f;">&copy; 2026 cnote. All rights reserved.</p>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
