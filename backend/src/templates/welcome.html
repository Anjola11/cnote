<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to cnote</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&amp;family=DM+Serif+Display:ital@0;1&amp;display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #fafaf8;
            color: #111110;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 560px;
            margin: 0 auto;
            background-color: #ffffff;
            border: 1px solid #e5e4de;
            border-radius: 20px;
            padding: 48px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }
        .logo {
            text-align: center;
            margin-bottom: 40px;
        }
        h1 {
            font-family: 'DM Serif Display', serif;
            color: #111110;
            font-size: 28px;
            margin-bottom: 16px;
            text-align: center;
            font-weight: 400;
        }
        p {
            color: #6b6a65;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 24px;
            text-align: center;
        }
        .button-container {
            text-align: center;
            margin-top: 32px;
            margin-bottom: 16px;
        }
        .btn {
            background-color: #4C3A94;
            color: #FFFFFF;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: 500;
            display: inline-block;
            transition: background-color 0.2s;
        }
        .footer {
            margin-top: 48px;
            border-top: 1px solid #e5e4de;
            padding-top: 24px;
            text-align: center;
            font-size: 12px;
            color: #a8a79f;
        }
        .logo-note-text {
            font-family: 'DM Serif Display', serif;
            font-size: 54px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <svg width="150" height="50" viewBox="0 0 300 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="10" y="20" width="60" height="60" rx="14" fill="#6B5CE7"/>
                <path d="M55 40C53 36 48 34 43 34C36 34 30 40 30 48C30 56 36 62 43 62C48 62 53 60 55 56" stroke="white" stroke-width="7" stroke-linecap="round"/>
                <path d="M55 56L60 66L50 66L55 56Z" fill="white"/>
                <text x="82" y="62" fill="#111110" class="logo-note-text">note</text>
            </svg>
        </div>
        <h1>Welcome to cnote</h1>
        <p>Your email has been successfully verified. You're all set to start organizing your thoughts, code, and growth.</p>
        
        <div class="button-container">
            <a href="https://cnote.app/dashboard" class="btn">Go to Dashboard</a>
        </div>
        
        <div class="footer">
            <p>If you have any questions, our support team is always here to help.</p>
            <p>&copy; 2026 cnote. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
